          - 'flows/usahaku/usahaku_tag_usaha_flow.yaml'
      apk_path:
        description: 'Optional path to APK file (e.g. app-release.apk)'
        required: false
        default: ''
      apk_url:
        description: 'Direct download URL for Possaku APK (pre-filled with latest, editable)'
        required: false
        default: 'https://drive.google.com/file/d/1kVEWcPO4rLoDT3v6ZOHnJ3xxX4eNeBKB/view?usp=sharing'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-android-test:
    name: Run Maestro Android 11 Regression on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      APP_ID: "com.cloudiex.possaku"
      PHONE_NUMBER: ${{ secrets.POSSAKU_PHONE_NUMBER }}
      PIN: ${{ secrets.POSSAKU_PIN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable KVM Hardware Acceleration
        run: |
          echo "Configuring /dev/kvm permissions for hardware virtualization..."
          sudo chmod 666 /dev/kvm || true
          ls -la /dev/kvm

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Maestro CLI
        run: |
          echo "Installing latest Maestro CLI on Linux..."
          export MAESTRO_DIR="$HOME/.maestro"
          curl -fsSL "https://get.maestro.mobile.dev" | bash || true

          # Fallback: if script did not install binary, download direct from GitHub release
          if [ ! -f "$HOME/.maestro/bin/maestro" ]; then
            echo "Installing via direct GitHub release archive..."
            mkdir -p /tmp/maestro_dl "$HOME/.maestro"
            curl -fSL --retry 3 "https://github.com/mobile-dev-inc/maestro/releases/latest/download/maestro.zip" -o /tmp/maestro_dl/maestro.zip
            unzip -qo /tmp/maestro_dl/maestro.zip -d /tmp/maestro_dl
            cp -rf /tmp/maestro_dl/maestro/* "$HOME/.maestro/"
            rm -rf /tmp/maestro_dl
          fi

          # Ensure execute permissions
          chmod +x "$HOME/.maestro/bin/maestro" || true

          # Make available system-wide via /usr/local/bin symlink and GITHUB_PATH
          sudo ln -sf "$HOME/.maestro/bin/maestro" /usr/local/bin/maestro
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          echo "MAESTRO_PATH=$HOME/.maestro/bin" >> $GITHUB_ENV

      - name: Verify Maestro Installation
        run: |
          which maestro
          maestro --version

      - name: Make Scripts Executable
        run: |
          chmod +x run_detailed_test.sh run_suite.sh restore_internet.sh generate_ci_summary.py download_apk.sh run_ci.sh

      - name: Cache AVD Snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-30-google-apis-x86_64-linux

      - name: Create AVD and Run Maestro Tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_URL: ${{ inputs.apk_url }}
          APK_PATH: ${{ inputs.apk_path }}
          TARGET_FLOW: ${{ inputs.target_flow }}
          APP_ID: "com.cloudiex.possaku"
          PHONE_NUMBER: ${{ secrets.POSSAKU_PHONE_NUMBER }}
          PIN: ${{ secrets.POSSAKU_PIN }}
          INVALID_PHONE: "085672222335"
          INVALID_PIN: "111222"
          INACTIVE_PHONE: "0856633633"
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -camera-back none -camera-front none -gpu swiftshader_indirect
          disable-animations: true
          script: ./run_ci.sh

      - name: Generate GitHub Actions Step Summary
        if: always()
        run: |
          python3 generate_ci_summary.py

      - name: Upload Playwright HTML Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-playwright-report-linux
          path: reports/*.html
          retention-days: 14
          if-no-files-found: warn
