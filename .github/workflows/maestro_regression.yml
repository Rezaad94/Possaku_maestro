          - 'flows/keuangan/saku_utama_laporan_penjualan_flow.yaml'
          - 'flows/keuangan/saku_utama_metode_pembayaran_flow.yaml'
          - 'flows/keuangan/saku_utama_pajak_hutang_voucher_flow.yaml'
          - 'flows/keuangan/saku_utama_pengeluaran_flow.yaml'
          - 'flows/keuangan/saku_utama_penjualan_karyawan_flow.yaml'
          - 'flows/keuangan/saku_utama_penjualan_produk_flow.yaml'
