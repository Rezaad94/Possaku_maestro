name: Maestro Mobile Test Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      target_flow:
        description: 'Select test flow, module directory, or full regression suite'
        required: true
        type: choice
        default: '.maestro/regression_suite.yaml'
        options:
          - '.maestro/regression_suite.yaml'
          - 'flows/kasir/'
          - 'flows/dashboard/'
          - 'flows/atur_produk/'
          - 'flows/daftar_pelanggan/'
          - 'flows/daftar_pesanan/'
          - 'flows/keuangan/'
          - 'flows/usahaku/'
          - 'flows/login/'
          - 'flows/lain_lain/'
          - 'flows/lain_lain/cetak_struk/'
          - 'flows/lain_lain/toko_online/'
          - 'flows/lain_lain/daftar_karyawan/'
          - 'flows/lain_lain/multi_usaha/'
          - 'flows/atur_produk/atur_produk_flow.yaml'
          - 'flows/atur_produk/product_add_edit_all_fields_flow.yaml'
          - 'flows/atur_produk/product_catalog_search_sort_flow.yaml'
          - 'flows/atur_produk/product_category_management_flow.yaml'
          - 'flows/atur_produk/product_create_variants_flow.yaml'
          - 'flows/atur_produk/product_edit_history_delete_flow.yaml'
          - 'flows/daftar_pelanggan/customer_debt_flow.yaml'
          - 'flows/daftar_pelanggan/customer_management_flow.yaml'
          - 'flows/daftar_pelanggan/customer_offline_flow.yaml'
          - 'flows/daftar_pelanggan/daftar_pelanggan_smoke_flow.yaml'
          - 'flows/daftar_pesanan/order_action_flow.yaml'
          - 'flows/daftar_pesanan/order_period_filter_flow.yaml'
          - 'flows/daftar_pesanan/order_queue_reset_flow.yaml'
          - 'flows/daftar_pesanan/order_smoke_flow.yaml'
          - 'flows/daftar_pesanan/order_status_filter_flow.yaml'
          - 'flows/dashboard/daftar_pesanan_flow.yaml'
          - 'flows/dashboard/filter_flow.yaml'
          - 'flows/dashboard/open_close_store_flow.yaml'
          - 'flows/dashboard/overview_flow.yaml'
          - 'flows/kasir/cart_flow.yaml'
          - 'flows/kasir/catalog_flow.yaml'
          - 'flows/kasir/payment_cash_flow.yaml'
          - 'flows/kasir/payment_methods_flow.yaml'
          - 'flows/kasir/preorder_offline_sort_flow.yaml'
          - 'flows/keuangan/keuangan_smoke_flow.yaml'
          - 'flows/keuangan/saku_lainnya_flow.yaml'
          - 'flows/keuangan/saku_utama_filter_flow.yaml'
          - 'flows/keuangan/saku_utama_laporan_penjualan_flow.yaml'
          - 'flows/keuangan/saku_utama_metode_pembayaran_flow.yaml'
          - 'flows/keuangan/saku_utama_pajak_hutang_voucher_flow.yaml'
          - 'flows/keuangan/saku_utama_pengeluaran_flow.yaml'
          - 'flows/keuangan/saku_utama_penjualan_karyawan_flow.yaml'
          - 'flows/keuangan/saku_utama_penjualan_produk_flow.yaml'
          - 'flows/keuangan/saku_utama_rekap_transaksi_flow.yaml'
          - 'flows/lain_lain/cetak_struk/cetak_struk_discount_flow.yaml'
          - 'flows/lain_lain/cetak_struk/cetak_struk_preview_flow.yaml'
          - 'flows/lain_lain/cetak_struk/cetak_struk_product_flow.yaml'
          - 'flows/lain_lain/cetak_struk/cetak_struk_smoke_flow.yaml'
          - 'flows/lain_lain/daftar_karyawan/karyawan_management_flow.yaml'
          - 'flows/lain_lain/daftar_karyawan/karyawan_salary_payslip_flow.yaml'
          - 'flows/lain_lain/multi_usaha/multi_usaha_branch_flow.yaml'
          - 'flows/lain_lain/multi_usaha/multi_usaha_login_delete_flow.yaml'
          - 'flows/lain_lain/multi_usaha/multi_usaha_modules_flow.yaml'
          - 'flows/lain_lain/toko_online/online_store_setting_flow.yaml'
          - 'flows/lain_lain/toko_online/toko_online_link_qr_flow.yaml'
          - 'flows/lain_lain/toko_online/toko_online_settings_flow.yaml'
          - 'flows/login/invalid_login_flow.yaml'
          - 'flows/login/logout_flow.yaml'
          - 'flows/login/valid_login_flow.yaml'
          - 'flows/usahaku/open_close_store_flow.yaml'
      apk_path:
        description: 'Optional path to APK file (e.g. app-release.apk)'
        required: false
        default: ''
      apk_url:
        description: 'Optional direct download URL for Possaku APK'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-android-test:
    name: Run Maestro Android 11 Regression on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      APP_ID: "com.cloudiex.possaku"
      PHONE_NUMBER: ${{ secrets.POSSAKU_PHONE_NUMBER }}
      PIN: ${{ secrets.POSSAKU_PIN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable KVM Hardware Acceleration
        run: |
          echo "Configuring /dev/kvm permissions for hardware virtualization..."
          sudo chmod 666 /dev/kvm || true
          ls -la /dev/kvm

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Maestro CLI
        run: |
          echo "Installing latest Maestro CLI on Linux..."
          curl -FsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          echo "MAESTRO_PATH=$HOME/.maestro/bin" >> $GITHUB_ENV

      - name: Verify Maestro Installation
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro --version

      - name: Make Scripts Executable
        run: |
          chmod +x run_detailed_test.sh run_suite.sh restore_internet.sh generate_ci_summary.py download_apk.sh

      - name: Cache AVD Snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-30-google-apis-x86_64-linux

      - name: Create AVD and Run Maestro Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -camera-back none -camera-front none -gpu swiftshader_indirect
          disable-animations: true
          script: |
            export PATH="$HOME/.maestro/bin:$PATH"

            # 1. Device check & online guarantee
            echo "Connected Android devices on Linux runner:"
            adb devices
            ./restore_internet.sh

            # 2. Install APK if URL (including Google Drive) or path is provided
            if [ -n "${{ inputs.apk_url }}" ]; then
              echo "Downloading and installing APK from URL..."
              ./download_apk.sh "${{ inputs.apk_url }}" app.apk
            elif [ -n "${{ inputs.apk_path }}" ] && [ -f "${{ inputs.apk_path }}" ]; then
              echo "Installing APK from path: ${{ inputs.apk_path }}..."
              adb install -r "${{ inputs.apk_path }}"
            fi

            # 3. Resolve target flow
            TARGET="${{ inputs.target_flow }}"
            if [ -z "$TARGET" ]; then
              TARGET=".maestro/regression_suite.yaml"
            fi

            echo "=========================================================="
            echo " Starting Maestro Test Execution in CI (Linux)"
            echo " Target: $TARGET"
            echo "=========================================================="

            ./run_suite.sh "$TARGET"

      - name: Generate GitHub Actions Step Summary
        if: always()
        run: |
          python3 generate_ci_summary.py

      - name: Upload Playwright HTML Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-playwright-report-linux
          path: reports/*.html
          retention-days: 14
          if-no-files-found: warn
