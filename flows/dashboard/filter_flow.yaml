appId: ${APP_ID}
tags:
  - regression-p2
  - dashboard
  - filters
---
- runScript:
    file: ../../pages/login/login_credential.js
- runScript:
    file: ../../pages/login/login_page.js
- runScript:
    file: ../../pages/dashboard/dashboard_page.js

# [SETUP] Ensure Logged In
- runFlow:
    file: ../../pages/login/ensure_logged_in.yaml
    env:
      phoneNumber: "${output.login_credential.dev.validPhoneNumber2}"
      PIN: "${output.login_credential.dev.validPIN}"
      expected1: ".*Selamat datang.*"
      expected2: ""

# [SETUP] Dismiss onboarding/update dialogs if visible
- tapOn:
    text: "Mengerti"
    optional: true

# [DASH-02] Filter by period (Hari ini, Minggu ini, Bulan ini)
- tapOn: "${output.dashboard_page.dateFilterButton}"
- runScript:
    file: ../../pages/delay.js

# Assert filter options are visible
- assertVisible: "${output.dashboard_page.filterHeaderLabel}"
- assertVisible: "${output.dashboard_page.filterOptionHariIni}"
- assertVisible: "${output.dashboard_page.filterOptionMingguIni}"
- swipe:
    start: "85%,25%"
    end: "15%,25%"
- assertVisible: "${output.dashboard_page.filterOptionBulanIni}"

# Swipe back and select "Hari ini" option to dismiss/close the filter dropdown
- swipe:
    start: "15%,25%"
    end: "85%,25%"
- tapOn: "${output.dashboard_page.filterOptionHariIni}"
- tapOn:
    text: "Terapkan Filter"
    optional: true
- runScript:
    file: ../../pages/delay.js
