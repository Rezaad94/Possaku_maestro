appId: ${APP_ID}
tags:
  - regression-p1
  - keuangan
  - saku-utama-karyawan
---
- runScript:
    file: ../../pages/login/login_credential.js
- runScript:
    file: ../../pages/login/login_page.js
- runScript:
    file: ../../pages/dashboard/dashboard_page.js
- runScript:
    file: ../../pages/keuangan/keuangan_page.js

# [SETUP] Ensure Logged In
- runFlow:
    file: ../../pages/login/ensure_logged_in.yaml
    env:
      phoneNumber: "${output.login_credential.dev.validPhoneNumber2}"
      PIN: "${output.login_credential.dev.validPIN}"
      expected1: ".*Selamat datang.*"
      expected2: ""

# [SETUP] Open Keuangan and navigate to Penjualan Karyawan
- tapOn: "${output.dashboard_page.keuanganMenuButton}"
- assertVisible: "${output.keuangan_page.headerTitle}"
- tapOn: ".*Saku Utama.*"
- assertVisible: "${output.keuangan_page.menuPenjualanKaryawan}"
- tapOn: "${output.keuangan_page.menuPenjualanKaryawan}"
- assertVisible: "${output.keuangan_page.penjualanKaryawanTitle}"

# [KEU-33] List total Per employee in laporan per karyawan
- assertVisible: ".*ref wij.*"
- assertVisible: ".*Jumlah Transaksi.*"
- assertVisible: ".*Total Penjualan.*"

# [KEU-34] View detail laporan per karyawan
- tapOn:
    text: ".*ref wij.*"
    optional: true

# [KEU-37] List transaction in laporan per karyawan detail
- assertVisible: ".*ref wij.*"
- assertVisible: ".*Total Penjualan.*"

# [KEU-36] Search transaction in laporan per karyawan detail
- tapOn:
    point: "975,250"
    optional: true

# [KEU-35] Download in laporan per karyawan detail
- tapOn:
    point: "${output.keuangan_page.downloadReportPoint}"
    optional: true
- tapOn:
    text: "SAVE"
    optional: true
- back:
    optional: true

# [TEARDOWN] Return to Dashboard from Keuangan
- tapOn:
    text: "${output.keuangan_page.backButton}"
    optional: true
- tapOn:
    text: "${output.keuangan_page.backButton}"
    optional: true
- tapOn:
    text: "${output.keuangan_page.backButton}"
    optional: true
- assertVisible: "${output.dashboard_page.overviewLabel}"

