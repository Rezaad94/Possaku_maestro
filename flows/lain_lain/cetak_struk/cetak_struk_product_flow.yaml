appId: ${APP_ID}
tags:
  - regression-p1
  - lain-lain
  - cetak-struk
  - struk-product
---
- runScript:
    file: ../../../pages/login/login_credential.js
- runScript:
    file: ../../../pages/login/login_page.js
- runScript:
    file: ../../../pages/dashboard/dashboard_page.js
- runScript:
    file: ../../../pages/lain_lain/cetak_struk_page.js

# [SETUP] Ensure Logged In
- runFlow:
    file: ../../../pages/login/ensure_logged_in.yaml
    env:
      phoneNumber: "${output.login_credential.dev.validPhoneNumber2}"
      PIN: "${output.login_credential.dev.validPIN}"
      expected1: ".*Selamat datang.*"
      expected2: ""

# [SETUP] Dismiss onboarding dialog if visible
- tapOn:
    text: "Mengerti"
    optional: true

# [SETUP] Open Cetak Struk
- tapOn:
    point: "${output.cetak_struk_page.lainLainMenuPoint}"
- assertVisible: "${output.cetak_struk_page.cetakStrukMenuButton}"
- tapOn:
    point: "${output.cetak_struk_page.cetakStrukMenuPoint}"
- assertVisible: "${output.cetak_struk_page.headerTitle}"

# [STRUK-02] Add Product form catalog
- tapOn: "${output.cetak_struk_page.katalogProdukButton}"
- assertVisible: "${output.cetak_struk_page.katalogTitle}"
- tapOn: "${output.cetak_struk_page.katalogProductFirstCard}"
- assertVisible: "${output.cetak_struk_page.variantSheetTitle}"
- tapOn:
    point: "${output.cetak_struk_page.variantQtyPlusPoint}"
- tapOn: "${output.cetak_struk_page.variantTambahkanButton}"
- assertVisible: "${output.cetak_struk_page.tambahkanKeStrukButton}"
- tapOn: "${output.cetak_struk_page.tambahkanKeStrukButton}"
- assertVisible: "${output.cetak_struk_page.headerTitle}"
- assertVisible: ".*beras oye.*"

# [STRUK-03] Increase quantity product added
- tapOn:
    point: "${output.cetak_struk_page.itemPlusPoint}"
- assertVisible: "2"

# [STRUK-04] Decrease quantity product added
- tapOn:
    point: "${output.cetak_struk_page.itemMinusPoint}"
- assertVisible: "1"

# [STRUK-05] Add custom product
- tapOn: "${output.cetak_struk_page.produkKostumButton}"
- assertVisible: "${output.cetak_struk_page.tambahProdukKostumTitle}"
- tapOn:
    point: "${output.cetak_struk_page.namaProdukInputPoint}"
- inputText: "Kopi Hitam"
- back
- tapOn:
    point: "${output.cetak_struk_page.jumlahInputPoint}"
- inputText: "2"
- back
- tapOn:
    point: "${output.cetak_struk_page.hargaInputPoint}"
- inputText: "15000"
- back
- tapOn: "${output.cetak_struk_page.tambahProdukKostumButton}"
- assertVisible: "${output.cetak_struk_page.headerTitle}"
- assertVisible: ".*Kopi Hitam.*"

# [STRUK-06] Delete added product
- swipe:
    start: "83%,32%"
    end: "18%,32%"
- tapOn:
    point: "${output.cetak_struk_page.itemDeleteTrashPoint}"
- assertVisible: "${output.cetak_struk_page.headerTitle}"

# Return to Dashboard
- tapOn:
    point: "${output.cetak_struk_page.backButtonPoint}"
- assertVisible: "${output.dashboard_page.overviewLabel}"
