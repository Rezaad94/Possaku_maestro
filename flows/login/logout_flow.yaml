appId: ${APP_ID}
---
- runScript:
    file: ../../pages/login/login_credential.js
- runScript:
    file: ../../pages/login/login_page.js
- runScript:
    file: ../../pages/dashboard/dashboard_page.js

# [SETUP] Ensure Logged In
- runFlow:
    file: ../../pages/login/ensure_logged_in.yaml
    env:
      phoneNumber: "${output.login_credential.dev.validPhoneNumber1}"
      PIN: "${output.login_credential.dev.validPIN}"
      expected1: ".*Selamat datang.*"
      expected2: ""

# [AUTH-08] Logout from active session
# Navigate to Profil tab (bottom nav Tab 4)
- tapOn: "${output.dashboard_page.profileIcon}"
# Dismiss onboarding/prompt if visible
- tapOn:
    text: "Mengerti"
    optional: true
- tapOn:
    text: "Nanti"
    optional: true
- tapOn:
    text: "Tutup"
    optional: true
# Open Pengaturan Lanjutan
- scrollUntilVisible:
    element:
      text: "Pengaturan Lanjutan"
    direction: DOWN
- tapOn: "Pengaturan Lanjutan"
# Tap Keluar
- tapOn: "Keluar"
# Confirm logout dialog
- assertVisible: "Konfirmasi.*"
- tapOn: "Ya"
# Verify we are back at the login screen
- assertVisible: "${output.login_page.loginButton}"

