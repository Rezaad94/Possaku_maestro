appId: ${APP_ID}
---
# [SETUP] Ensure Logged In
- runFlow:
    file: ../../pages/login/login_flow.yaml
    env:
      phoneNumber: "${output.login_credential.dev.validPhoneNumber1}"
      PIN: "${output.login_credential.dev.validPIN}"
      expected1: ".*Selamat datang.*"
      expected2: ""

# [AUTH-08] Logout from active session
- tapOn: "${output.dashboard_page.profileIcon}"   # placeholder, replace with actual locator
- tapOn: "Logout"
- assertVisible: "${output.login_page.loginButton}"   # login button should appear again

