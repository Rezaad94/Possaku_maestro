appId: ${APP_ID}
tags:
  - regression-p0
  - riwayat
  - riwayat-tabs
---
- runScript:
    file: ../../pages/login/login_credential.js
- runScript:
    file: ../../pages/login/login_page.js
- runScript:
    file: ../../pages/dashboard/dashboard_page.js
- runScript:
    file: ../../pages/riwayat/riwayat_page.js

# Setup: Login
- runFlow:
    file: ../../pages/login/ensure_logged_in.yaml
    env:
      phoneNumber: "${output.login_credential.dev.validPhoneNumber2}"
      PIN: "${output.login_credential.dev.validPIN}"
      expected1: ".*Selamat datang.*"
      expected2: ""

- tapOn:
    text: "Mengerti"
    optional: true

# [RIWAYAT-01] Navigate to Riwayat and Verify Semua Tab
- tapOn: "${output.riwayat_page.riwayatTab}"
- assertVisible: "${output.riwayat_page.riwayatHeader}"
- assertVisible: "${output.riwayat_page.headerDateFilter}"
- assertVisible: "${output.riwayat_page.tabSemua}"

# [RIWAYAT-02] View Online Order Tab
- tapOn: "${output.riwayat_page.tabOnlineOrder}"
- assertVisible: "${output.riwayat_page.tabOnlineOrder}"

# [RIWAYAT-03] View Penjualan Tab
- tapOn: "${output.riwayat_page.tabPenjualan}"
- assertVisible: "${output.riwayat_page.tabPenjualan}"

# Swipe Horizontal Tabs to reveal remaining categories
- swipe:
    start: "65%,18%"
    end: "10%,18%"

# [RIWAYAT-04] View Pengeluaran Tab (if visible in current scroll)
- tapOn:
    text: "${output.riwayat_page.tabPengeluaran}"
    optional: true

# [RIWAYAT-05] View Angsuran Hutang Tab (if visible)
- tapOn:
    text: "${output.riwayat_page.tabAngsuranHutang}"
    optional: true

# [RIWAYAT-06] View QRIS Tab
- tapOn: "${output.riwayat_page.tabQris}"
- assertVisible: "${output.riwayat_page.tabQris}"

# [RIWAYAT-07] View Transfer Tab
- tapOn: "${output.riwayat_page.tabTransfer}"
- assertVisible: "${output.riwayat_page.tabTransfer}"

# [RIWAYAT-08] View Transaksi Dibatalkan Tab
- tapOn: "${output.riwayat_page.tabTransaksiDibatalkan}"
- assertVisible: "${output.riwayat_page.tabTransaksiDibatalkan}"

# [RIWAYAT-09] View Debit/Kredit Tab
- swipe:
    start: "65%,18%"
    end: "30%,18%"
    optional: true
- tapOn:
    text: "${output.riwayat_page.tabDebitKredit}"
    optional: true
- assertVisible:
    text: "${output.riwayat_page.tabDebitKredit}"
    optional: true

# [RIWAYAT-12] Reset Filter Functionality — tap Semua to trigger a filter-active state, then reset
- swipe:
    start: "10%,18%"
    end: "65%,18%"
- tapOn: "${output.riwayat_page.tabSemua}"
- tapOn:
    text: "${output.riwayat_page.tabResetFilter}"
    optional: true

# Verify Semua Tab is still visible after Reset
- assertVisible: "${output.riwayat_page.tabSemua}"
