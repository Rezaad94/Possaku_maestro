appId: com.cloudiex.possaku
---
- runScript:
    file: ../../pages/login/login_page.js

- launchApp:
    clearState: true
# Wait for app initial screen to appear
- extendedWaitUntil:
    visible: ".*Masuk.*|.*Lewati.*|.*Mengerti.*|.*\\+62.*"
    timeout: 20000

# Dismiss initial dialogs or onboarding if present
- tapOn:
    text: "Mengerti"
    optional: true
- tapOn:
    text: "${output.login_page.skipButton}"
    optional: true

# If on welcome landing screen, tap "Masuk" to navigate to login form
- runFlow:
    when:
      visible: "${output.login_page.loginButton}"
      notVisible: "${output.login_page.phoneNumberField}"
    commands:
      - tapOn: "${output.login_page.loginButton}"
      - runScript:
          file: ../../pages/delay.js

# Ensure login input fields are ready
- extendedWaitUntil:
    visible: "${output.login_page.phoneNumberField}"
    timeout: 15000
- tapOn: "${output.login_page.phoneNumberField}"
- inputText: "${phoneNumber}"
- pressKey: "enter"
- tapOn:
    point: "${output.login_page.PINField}"
- inputText: "${PIN}"
- pressKey: "enter"
- tapOn: "${output.login_page.submitButton}"
- runScript:
    file: ../../pages/delay.js
- runScript:
    file: ../../pages/delay.js
- runScript:
    file: ../../pages/delay.js
- runFlow:
    when:
      visible: ".*Masalah koneksi.*"
    commands:
      - tapOn:
          point: "540,1160"
      - runScript:
          file: ../../pages/delay.js
      - tapOn: "${output.login_page.submitButton}"
      - runScript:
          file: ../../pages/delay.js
      - runScript:
          file: ../../pages/delay.js
- tapOn:
    text: "Mengerti"
    optional: true
- runFlow:
    when:
      notVisible: "${expected1}"
    commands:
      - tapOn:
          text: "Mengerti"
          optional: true
- assertVisible: 
    text: "${expected1}"
- runFlow:
    commands:
      - assertVisible:
          text: "${expected2}"
    when:
      true: "${typeof expected2 !== 'undefined' && expected2 !== null && expected2 !== ''}"

